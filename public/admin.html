<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>Admin Panel — Gathering 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      color: #333;
    }

    /* ─── Navbar ─────────────────────────────────────────────── */
    .navbar {
      background: #ffffff;
      color: #1a202c;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      position: sticky; top: 0; z-index: 100;
    }
    .navbar .brand { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
    .navbar .brand-logo { height: 38px; width: auto; object-fit: contain; }
    .navbar .nav-links { display: flex; gap: 8px; }
    .nav-btn {
      background: #f0f4f8;
      border: 1px solid #e2e8f0;
      color: #3182ce;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background .2s;
    }
    .nav-btn:hover { background: #e2e8f0; }
    .nav-btn.active { background: rgba(255,255,255,.3); }
    .nav-btn a { color: inherit; text-decoration: none; }

    /* ─── Layout ─────────────────────────────────────────────── */
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    /* ─── Tabs ───────────────────────────────────────────────── */
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: #e0e0e0; padding: 4px; border-radius: 12px; width: fit-content; }
    .tab-btn {
      padding: 8px 18px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #666;
      transition: all .2s;
    }
    .tab-btn.active { background: #fff; color: #1a73e8; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ─── Stats Cards ────────────────────────────────────────── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      text-align: center;
    }
    .stat-card .icon { font-size: 32px; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 800; color: #1a73e8; }
    .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; font-weight: 600; text-transform: uppercase; }

    /* ─── Table ──────────────────────────────────────────────── */
    .table-wrap {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      overflow: hidden;
    }
    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .table-header h3 { font-size: 16px; font-weight: 700; }
    .table-header .badge {
      background: #e8f0fe;
      color: #1a73e8;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      background: #f8f9fa;
      padding: 11px 16px;
      font-size: 12px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      text-align: left;
      border-bottom: 1px solid #e8e8e8;
    }
    td {
      padding: 11px 16px;
      font-size: 14px;
      border-bottom: 1px solid #f5f5f5;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfd; }

    .badge-unit {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: #e8f0fe;
      color: #1a73e8;
    }
    .badge-hadir {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-hadir.yes { background: #e8f5e9; color: #2e7d32; }
    .badge-hadir.no  { background: #fce4ec; color: #c62828; }

    /* ─── Kelompok Section ───────────────────────────────────── */
    .kelompok-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .kelompok-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      overflow: hidden;
    }
    .kelompok-card .kcard-header {
      background: linear-gradient(135deg, #1a73e8, #0052cc);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kelompok-card .kcard-header h4 { font-size: 15px; font-weight: 700; }
    .kelompok-card .kcard-header .count {
      background: rgba(255,255,255,.25);
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .kelompok-card .kcard-body { padding: 8px 0; max-height: 280px; overflow-y: auto; }
    .member-row {
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #f5f5f5;
    }
    .member-row:last-child { border-bottom: none; }
    .member-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #e8f0fe;
      color: #1a73e8;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .member-name { font-size: 13px; font-weight: 600; color: #222; flex: 1; }
    .member-unit { font-size: 11px; color: #888; }
    .member-hadir { font-size: 18px; }

    /* ─── Edit kelompok ──────────────────────────────────────── */
    .edit-k-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: rgba(255,255,255,.7);
      padding: 2px 6px;
      border-radius: 6px;
      transition: color .2s, background .2s;
    }
    .edit-k-btn:hover { color: #fff; background: rgba(255,255,255,.15); }

    .move-btn {
      background: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      color: #555;
      transition: all .2s;
    }
    .move-btn:hover { background: #1a73e8; border-color: #1a73e8; color: #fff; }

    /* ─── Modal ──────────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .modal h3 { margin-bottom: 16px; font-size: 17px; }
    .modal input, .modal select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ccc;
      border-radius: 9px;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .modal input:focus, .modal select:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26,115,232,.12);
    }
    .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-primary {
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: #0052cc; }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      border: none;
      padding: 9px 18px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #e0e0e0; }

    /* ─── Progress Bar ───────────────────────────────────────── */
    .progress-wrap { background: #f0f0f0; border-radius: 20px; height: 8px; overflow: hidden; margin-top: 6px; }
    .progress-bar  { height: 100%; background: linear-gradient(90deg, #1a73e8, #00c853); border-radius: 20px; transition: width .4s; }

    /* ─── Toast ──────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #333; color: #fff;
      padding: 12px 18px; border-radius: 10px; font-size: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
      z-index: 9999; opacity: 0; transform: translateY(10px);
      transition: all .3s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      .container { padding: 12px; }
      .kelompok-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <img src="/logo.png" alt="Telkom CorpU" class="brand-logo" />
    <span>Admin Panel — Gathering 2026</span>
  </div>
  <div class="nav-links">
    <button class="nav-btn"><a href="/" target="_blank">🔗 Halaman Registrasi</a></button>
    <button class="nav-btn"><a href="/qrcode.html" target="_blank">📱 Generate QR</a></button>
    <button class="nav-btn" onclick="refreshAll()">🔄 Refresh</button>
  </div>
</nav>

<div class="container">
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard')">📊 Dashboard</button>
    <button class="tab-btn" onclick="switchTab('kelompok')">👥 Kelompok</button>
    <button class="tab-btn" onclick="switchTab('karyawan')">📋 Semua Karyawan</button>
  </div>

  <!-- ─── Tab: Dashboard ─────────────────────────────────────── -->
  <div class="tab-content active" id="tab-dashboard">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="icon">👥</div><div class="value" id="stat-total">—</div><div class="label">Total Karyawan</div></div>
      <div class="stat-card"><div class="icon">✅</div><div class="value" id="stat-hadir">—</div><div class="label">Sudah Hadir</div></div>
      <div class="stat-card"><div class="icon">⏳</div><div class="value" id="stat-belum">—</div><div class="label">Belum Hadir</div></div>
      <div class="stat-card"><div class="icon">📊</div><div class="value" id="stat-pct">—</div><div class="label">Persentase Hadir</div></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;">
      <!-- Per Unit -->
      <div class="table-wrap">
        <div class="table-header"><h3>📦 Per Unit</h3></div>
        <table>
          <thead><tr><th>Unit</th><th>Hadir</th><th>Total</th><th>Progress</th></tr></thead>
          <tbody id="unit-tbody"></tbody>
        </table>
      </div>

      <!-- Per Kelompok -->
      <div class="table-wrap">
        <div class="table-header"><h3>🏆 Per Kelompok</h3></div>
        <table>
          <thead><tr><th>Kelompok</th><th>Hadir</th><th>Total</th><th>Progress</th></tr></thead>
          <tbody id="kel-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ─── Tab: Kelompok ──────────────────────────────────────── -->
  <div class="tab-content" id="tab-kelompok">
    <div class="kelompok-grid" id="kelompok-grid"></div>
  </div>

  <!-- ─── Tab: Karyawan ─────────────────────────────────────── -->
  <div class="tab-content" id="tab-karyawan">
    <div style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;">
      <input id="search-karyawan" type="text" placeholder="🔍 Cari nama / unit..." style="padding:9px 14px;border:1.5px solid #ccc;border-radius:9px;font-size:14px;width:260px;" />
      <select id="filter-unit" style="padding:9px 14px;border:1.5px solid #ccc;border-radius:9px;font-size:14px;">
        <option value="">Semua Unit</option>
      </select>
      <select id="filter-hadir" style="padding:9px 14px;border:1.5px solid #ccc;border-radius:9px;font-size:14px;">
        <option value="">Semua Status</option>
        <option value="1">Sudah Hadir</option>
        <option value="0">Belum Hadir</option>
      </select>
    </div>
    <div class="table-wrap">
      <div class="table-header">
        <h3>📋 Data Karyawan</h3>
        <span class="badge" id="karyawan-count">0 orang</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nama</th>
            <th>Unit</th>
            <th>Kota</th>
            <th>Kelompok</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="karyawan-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: Rename Kelompok -->
<div class="modal-overlay" id="modal-rename">
  <div class="modal">
    <h3>✏️ Ganti Nama Kelompok</h3>
    <input type="hidden" id="rename-id" />
    <input type="text" id="rename-nama" placeholder="Nama kelompok baru..." />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-rename')">Batal</button>
      <button class="btn-primary" onclick="doRename()">Simpan</button>
    </div>
  </div>
</div>

<!-- Modal: Pindah Kelompok -->
<div class="modal-overlay" id="modal-move">
  <div class="modal">
    <h3>🔄 Pindah Kelompok</h3>
    <p id="move-emp-name" style="margin-bottom:12px;font-weight:600;color:#333;"></p>
    <input type="hidden" id="move-emp-id" />
    <select id="move-kelompok-select"></select>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('modal-move')">Batal</button>
      <button class="btn-primary" onclick="doMove()">Pindahkan</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  let statsData  = null;
  let kelompokData = null;
  let allKaryawan  = [];

  // ─── Tab Switching ────────────────────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    event.target.classList.add('active');
  }

  // ─── Load Data ────────────────────────────────────────────────────────────────
  async function loadStats() {
    const res = await fetch('/api/admin/stats');
    statsData = await res.json();
    renderStats();
  }

  async function loadKelompok() {
    const res = await fetch('/api/admin/kelompok');
    kelompokData = await res.json();
    renderKelompok();

    // Flatten untuk karyawan tab
    allKaryawan = [];
    kelompokData.forEach(k => {
      k.anggota.forEach(a => {
        allKaryawan.push({ ...a, kelompok_id: k.id, kelompok_nama: k.nama });
      });
    });
    renderKaryawan();
    populateUnitFilter();
  }

  async function refreshAll() {
    await Promise.all([loadStats(), loadKelompok()]);
    showToast('✅ Data diperbarui');
  }

  // ─── Render Stats ─────────────────────────────────────────────────────────────
  function renderStats() {
    const { total, hadir, byUnit, byKelompok } = statsData;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-hadir').textContent = hadir;
    document.getElementById('stat-belum').textContent = total - hadir;
    document.getElementById('stat-pct').textContent   = Math.round(hadir / total * 100) + '%';

    const unitTbody = document.getElementById('unit-tbody');
    unitTbody.innerHTML = byUnit.map(u => {
      const pct = Math.round((u.hadir || 0) / u.total * 100);
      return `<tr>
        <td><span class="badge-unit">${u.unit}</span></td>
        <td>${u.hadir || 0}</td>
        <td>${u.total}</td>
        <td style="min-width:80px">
          <div style="font-size:11px;color:#888;margin-bottom:3px">${pct}%</div>
          <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
        </td>
      </tr>`;
    }).join('');

    const kelTbody = document.getElementById('kel-tbody');
    kelTbody.innerHTML = byKelompok.map(k => {
      const pct = k.total ? Math.round((k.hadir || 0) / k.total * 100) : 0;
      return `<tr>
        <td style="font-weight:600">${k.nama}</td>
        <td>${k.hadir || 0}</td>
        <td>${k.total}</td>
        <td style="min-width:80px">
          <div style="font-size:11px;color:#888;margin-bottom:3px">${pct}%</div>
          <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
        </td>
      </tr>`;
    }).join('');
  }

  // ─── Render Kelompok ──────────────────────────────────────────────────────────
  function renderKelompok() {
    const grid = document.getElementById('kelompok-grid');
    grid.innerHTML = kelompokData.map(k => `
      <div class="kelompok-card">
        <div class="kcard-header">
          <h4>${k.nama}</h4>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="count">${k.anggota.length} orang</span>
            <button class="edit-k-btn" onclick="openRename(${k.id},'${escHtml(k.nama)}')">✏️</button>
          </div>
        </div>
        <div class="kcard-body">
          ${k.anggota.map(a => `
            <div class="member-row">
              <div class="member-avatar">${a.nama.charAt(0).toUpperCase()}</div>
              <div style="flex:1;min-width:0">
                <div class="member-name">${escHtml(a.nama)}</div>
                <div class="member-unit">${a.unit} · ${a.kota}</div>
              </div>
              <span class="member-hadir">${a.checked_in ? '✅' : '⬜'}</span>
              <button class="move-btn" onclick="openMove(${a.id},'${escHtml(a.nama)}',${k.id})">Pindah</button>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  // ─── Render Karyawan Table ────────────────────────────────────────────────────
  function renderKaryawan() {
    const search = document.getElementById('search-karyawan').value.toLowerCase();
    const fUnit  = document.getElementById('filter-unit').value;
    const fHadir = document.getElementById('filter-hadir').value;

    let data = allKaryawan;
    if (search)  data = data.filter(e => e.nama.toLowerCase().includes(search) || e.unit.toLowerCase().includes(search));
    if (fUnit)   data = data.filter(e => e.unit === fUnit);
    if (fHadir !== '') data = data.filter(e => String(e.checked_in) === fHadir);

    document.getElementById('karyawan-count').textContent = `${data.length} orang`;

    const tbody = document.getElementById('karyawan-tbody');
    tbody.innerHTML = data.map((e, i) => `
      <tr>
        <td style="color:#aaa;font-size:12px">${i+1}</td>
        <td style="font-weight:600">${escHtml(e.nama)}</td>
        <td><span class="badge-unit">${e.unit}</span></td>
        <td style="color:#666">${e.kota}</td>
        <td style="font-size:13px">${e.kelompok_nama}</td>
        <td><span class="badge-hadir ${e.checked_in?'yes':'no'}">${e.checked_in?'✅ Hadir':'⬜ Belum'}</span></td>
        <td><button class="move-btn" onclick="openMove(${e.id},'${escHtml(e.nama)}',${e.kelompok_id})">🔄 Pindah</button></td>
      </tr>
    `).join('');
  }

  function populateUnitFilter() {
    const units = [...new Set(allKaryawan.map(e => e.unit))].sort();
    const sel = document.getElementById('filter-unit');
    sel.innerHTML = '<option value="">Semua Unit</option>' +
      units.map(u => `<option value="${u}">${u}</option>`).join('');
  }

  // ─── Search / Filter ──────────────────────────────────────────────────────────
  ['search-karyawan','filter-unit','filter-hadir'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderKaryawan);
  });

  // ─── Rename Kelompok ──────────────────────────────────────────────────────────
  function openRename(id, nama) {
    document.getElementById('rename-id').value   = id;
    document.getElementById('rename-nama').value = nama;
    document.getElementById('modal-rename').classList.add('show');
    setTimeout(() => document.getElementById('rename-nama').focus(), 100);
  }

  async function doRename() {
    const id   = document.getElementById('rename-id').value;
    const nama = document.getElementById('rename-nama').value.trim();
    if (!nama) return;
    const res = await fetch(`/api/admin/kelompok/${id}/nama`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nama })
    });
    if ((await res.json()).success) {
      closeModal('modal-rename');
      await refreshAll();
      showToast('✅ Nama kelompok diperbarui');
    }
  }

  // ─── Move Member ──────────────────────────────────────────────────────────────
  function openMove(empId, empNama, currentKelId) {
    document.getElementById('move-emp-id').value       = empId;
    document.getElementById('move-emp-name').textContent = empNama;
    const sel = document.getElementById('move-kelompok-select');
    sel.innerHTML = kelompokData.map(k =>
      `<option value="${k.id}" ${k.id === currentKelId ? 'selected' : ''}>${k.nama}</option>`
    ).join('');
    document.getElementById('modal-move').classList.add('show');
  }

  async function doMove() {
    const empId    = document.getElementById('move-emp-id').value;
    const kelId    = document.getElementById('move-kelompok-select').value;
    const res = await fetch(`/api/admin/employee/${empId}/kelompok`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kelompok_id: kelId })
    });
    if ((await res.json()).success) {
      closeModal('modal-move');
      await refreshAll();
      showToast('✅ Anggota berhasil dipindahkan');
    }
  }

  // ─── Modal ────────────────────────────────────────────────────────────────────
  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('show'); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.show').forEach(el => el.classList.remove('show'));
  });

  // ─── Toast ────────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ─── Helpers ──────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ─── Init ─────────────────────────────────────────────────────────────────────
  refreshAll();
  setInterval(loadStats, 30000); // auto-refresh stats setiap 30 detik
</script>
</body>
</html>
